<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Ralph Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <h1>🤖 Agent Ralph</h1>
      <span id="status" class="status">Connecting...</span>
    </div>
    <div class="header-right">
      <span id="progress"></span>
    </div>
  </header>

  <div id="controls" class="controls-panel">
    <div class="control-group">
      <label>Plan iterations</label>
      <input type="number" id="planInput" min="0" max="100" value="1">
    </div>
    <div class="control-group">
      <label>Build iterations</label>
      <input type="number" id="buildInput" min="0" max="100" value="5">
    </div>
    <div class="control-group">
      <label>Cycles</label>
      <input type="number" id="cyclesInput" min="0" max="100" value="0">
      <small>0 = until done</small>
    </div>
    <div class="control-group checkbox">
      <label>
        <input type="checkbox" id="stopOnZeroInput" checked>
        Stop on zero pending tasks
      </label>
    </div>
    <div class="control-buttons">
      <button id="startBtn" class="btn btn-primary">▶ Start</button>
      <button id="stopBtn" class="btn btn-danger" disabled>⏹ Stop</button>
    </div>
  </div>

  <main>
    <div id="mainPanel" class="panel">
      <div class="panel-header">
        <span>Main Agent</span>
        <button id="clearLogsBtn" class="btn-small">Clear</button>
      </div>
      <div id="mainLog" class="log-container"></div>
    </div>

    <aside id="sidebar">
      <div class="panel-header">Sub-agents <span id="subagentCount">(0)</span></div>
      <div id="subagentList" class="subagent-list"></div>
    </aside>
  </main>

  <div id="subagentModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Sub-agent</span>
        <button id="closeModal" class="btn-close">×</button>
      </div>
      <div id="modalLog" class="log-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
